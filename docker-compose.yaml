services:
  python-engine:
    build:
      context: ./java-backend
      dockerfile: Dockerfile.python
    ports:
      - "5000:5000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - ./java-backend/eminescu_adapter_qwen:/app/eminescu_adapter_qwen
      - ./java-backend/yuan_adapter_qwen:/app/yuan_adapter_qwen
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  java-backend:
    build:
      context: ./java-backend
      dockerfile: Dockerfile.java
    ports:
      - "80:8080"
    volumes:
      - ./saved_poems:/app/saved_poems
    depends_on:
      - python-engine
    restart: unless-stopped

volumes:
  hf_cache: